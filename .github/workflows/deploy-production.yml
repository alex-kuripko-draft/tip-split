name: Deploy production
# Manual only. Run by DevOps for an owner-authorized release: deploys the given
# commit of main to GitHub Pages and records a `production` deployment for it.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA on main to release (40 hex)
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Validate SHA format
        env:
          SHA: ${{ inputs.sha }}
        run: echo "$SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - run: git merge-base --is-ancestor "${{ inputs.sha }}" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm test
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Record production deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          id=$(gh api "repos/$REPO/deployments" -X POST -f ref="$SHA" -f environment=production \
            -F auto_merge=false -F "required_contexts[]" -f description="production release" --jq .id)
          curl -fsS "$PAGE_URL" | grep -q '<title>Tip Split</title>'   # smoke test
          gh api "repos/$REPO/deployments/$id/statuses" -X POST -f state=success -f environment=production \
            -f log_url="$RUN_URL" -f environment_url="$PAGE_URL" >/dev/null
          echo "production deployment $id for $SHA"
