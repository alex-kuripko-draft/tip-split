name: Deploy dev
# Every push to develop is tested, smoke-checked and recorded as a `dev`
# deployment of that exact commit (GitHub Deployments API).
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: deploy-dev
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm test
      - name: Record dev deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          id=$(gh api "repos/$REPO/deployments" -X POST -f ref="$SHA" -f environment=dev \
            -F auto_merge=false -F "required_contexts[]" -f description="dev deployment" --jq .id)
          gh api "repos/$REPO/deployments/$id/statuses" -X POST -f state=in_progress -f log_url="$RUN_URL" >/dev/null
          test -s src/index.html   # smoke check: the page is present in the deployed commit
          gh api "repos/$REPO/deployments/$id/statuses" -X POST -f state=success -f environment=dev \
            -f log_url="$RUN_URL" \
            -f environment_url="https://github.com/$REPO/blob/$SHA/src/index.html" >/dev/null
          echo "dev deployment $id for $SHA"
